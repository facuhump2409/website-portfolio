<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
aria-label="Facundo Humphreys">
<style>
/* Inverts with the browser/OS theme so the mark stays legible on either
tab-bar colour. */
.plate { fill: #0a0a0a; }
.mark { fill: #ffffff; }
@media (prefers-color-scheme: light) {
.plate { fill: #fafafa; }
.mark { fill: #0a0a0a; }
}
</style>
<rect class="plate" width="64" height="64" rx="14" />
<text class="mark" x="32" y="33" text-anchor="middle" dominant-baseline="central"
font-family="Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
font-size="30" font-weight="600" letter-spacing="-1.6">FH</text>
</svg>